<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Primary SEO Meta Tags -->
  <title>Vibe Music Player - Aesthetic Indian Lo-Fi & Retro Player</title>
  <meta name="title" content="Vibe Music Player - Aesthetic Indian Lo-Fi & Retro Player">
  <meta name="description" content="Aesthetic Indian Tapri & Lo-Fi retro music player with dynamic moods, rain sound synthesizer, zen mode, and cloud synced tracks.">
  <meta name="keywords" content="vibe music player, lofi music player, indian aesthetic player, radhe chai wala, retro bollywood lofi, aditya kushal">
  <meta name="author" content="Aditya Kushal">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook / WhatsApp Share Preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://github.com/">
  <meta property="og:title" content="Vibe Music Player - Retro Indian Lo-Fi">
  <meta property="og:description" content="Listen to curated retro vibes, dynamic rain synthesizer, and switch atmospheric themes.">
  <meta property="og:image" content="bg1-mobile.png">

  <!-- Twitter Meta Tags -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Vibe Music Player">
  <meta property="twitter:description" content="Aesthetic Indian Lo-Fi & Retro Music Experience.">
  <meta property="twitter:image" content="bg1-mobile.png">

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vibe Player">
  <link rel="apple-touch-icon" href="bg1-mobile.png">

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="mood-sunset">

  <!-- Responsive Background & Scrim -->
  <div class="app-background" id="app-background"></div>
  <div class="scrim-overlay"></div>

  <!-- Dynamic Weather Canvas -->
  <canvas id="weather-canvas"></canvas>

  <!-- Top Action Container (Mood & Zen Mode) -->
  <div class="scene-switcher-container">
    <button class="scene-btn" id="mood-toggle-btn" title="Click to cycle Mood">
      <i class="ri-sun-cloudy-line" id="mood-icon"></i>
      <span id="mood-label">Sunset</span>
    </button>
    <button class="scene-btn zen-btn" id="zen-toggle-btn" title="Zen Mode (Hide UI) - Shortcut: Z">
      <i class="ri-focus-3-line"></i>
      <span>Zen</span>
    </button>
  </div>

  <!-- 2 Dedicated Bouncing Screen Balls -->
  <button class="bounce-ball" id="open-drawer-btn" title="Open Playlist">
    <i class="ri-play-list-2-fill"></i>
    <span class="float-badge" id="track-count">0</span>
  </button>

  <button class="bounce-ball" id="quick-upload-btn" title="Add Local Audio">
    <i class="ri-folder-music-fill"></i>
  </button>
  <input type="file" id="audio-file-input" accept="audio/*" multiple hidden>

  <!-- Clean Floating & Draggable Volume Pill -->
  <div class="draggable-volume-box" id="draggable-volume" title="Drag anywhere!">
    <i class="ri-volume-up-line" id="volume-icon" title="Mute/Unmute"></i>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
  </div>

  <!-- Main Transparent Overlay Player -->
  <main class="player-container">
    <div class="player-content">
      
      <!-- 1. Track Meta & Like Heart -->
      <section class="track-meta">
        <div class="title-like-row">
          <h1 class="track-title" id="track-title">Loading Track...</h1>
          <button class="heart-btn" id="main-heart-btn" title="Like this song">
            <i class="ri-heart-line" id="main-heart-icon"></i>
          </button>
        </div>
        <p class="track-artist" id="track-artist">My Favourite Artist</p>
      </section>

      <!-- 2. Progress / Seek Bar Section -->
      <section class="progress-section">
        <div class="seek-container" id="seek-container">
          <div class="seek-bar" id="seek-bar">
            <div class="seek-progress" id="seek-progress"></div>
            <div class="seek-thumb" id="seek-thumb"></div>
          </div>
        </div>
        <div class="time-display">
          <span id="current-time">0:00</span>
          <span id="duration-time">0:00</span>
        </div>
      </section>

      <!-- 3. Music Control Buttons -->
      <section class="controls-section">
        <button class="ctrl-btn icon-only" id="shuffle-btn" title="Shuffle">
          <i class="ri-shuffle-line"></i>
        </button>
        <button class="ctrl-btn icon-only" id="prev-btn" title="Previous">
          <i class="ri-skip-back-fill"></i>
        </button>
        <button class="ctrl-btn play-pause-btn" id="play-btn" title="Play/Pause">
          <i class="ri-play-fill" id="play-icon"></i>
        </button>
        <button class="ctrl-btn icon-only" id="next-btn" title="Next">
          <i class="ri-skip-forward-fill"></i>
        </button>
        <button class="ctrl-btn icon-only" id="repeat-btn" title="Repeat">
          <i class="ri-repeat-line"></i>
        </button>
      </section>

    </div>
  </main>

  <!-- Playlist Drawer Backdrop -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <!-- Bottom Slide-Up Song List Drawer -->
  <aside class="playlist-drawer" id="playlist-drawer">
    <div class="drawer-handle"></div>
    
    <div class="drawer-header">
      <div>
        <h3>Tracks & Settings</h3>
        <p>42 Tracks • Backgrounds & Sync</p>
      </div>
      <button class="close-drawer-btn" id="close-drawer-btn">
        <i class="ri-close-line"></i>
      </button>
    </div>

    <!-- 1. Background Image Switcher -->
    <div class="custom-picker-section">
      <span class="picker-title"><i class="ri-image-2-line"></i> Background Image:</span>
      <div class="picker-grid">
        <button class="grid-btn bg-btn active" data-bg="0">Background 1</button>
        <button class="grid-btn bg-btn" data-bg="1">Background 2</button>
        <button class="grid-btn bg-btn" data-bg="2">Background 3</button>
        <button class="grid-btn bg-btn" data-bg="3">Background 4</button>
      </div>
    </div>

    <!-- 2. Mood & Atmosphere Effects Switcher -->
    <div class="custom-picker-section">
      <span class="picker-title"><i class="ri-sparkling-line"></i> Mood & Atmosphere:</span>
      <div class="picker-grid">
        <button class="grid-btn mood-btn" data-mood="0"><i class="ri-sun-fill"></i> Sunrise</button>
        <button class="grid-btn mood-btn active" data-mood="1"><i class="ri-sun-cloudy-line"></i> Sunset</button>
        <button class="grid-btn mood-btn" data-mood="2"><i class="ri-rainy-line"></i> Monsoon</button>
        <button class="grid-btn mood-btn" data-mood="3"><i class="ri-moon-clear-line"></i> Midnight</button>
      </div>
    </div>

    <!-- 3. Ambient Lo-Fi Rain Volume -->
    <div class="ambient-mixer-card">
      <div class="ambient-row">
        <div class="ambient-label">
          <i class="ri-rainy-line"></i> <span>Rain Lo-Fi Sound</span>
        </div>
        <input type="range" id="rain-slider" min="0" max="1" step="0.05" value="0">
      </div>
    </div>

    <!-- 4. Instant Search Bar -->
    <div class="search-box-container">
      <i class="ri-search-2-line search-icon"></i>
      <input type="text" id="playlist-search-input" placeholder="Search track name...">
    </div>

    <!-- 5. Playlist Filter Tabs -->
    <div class="playlist-tabs">
      <button class="tab-btn active" id="tab-all-btn">All Tracks (42)</button>
      <button class="tab-btn" id="tab-liked-btn"><i class="ri-heart-fill"></i> Liked (<span id="liked-count">0</span>)</button>
    </div>

    <!-- 6. Dual Upload Section (Main Playlist & Local Upload) -->
    <div class="dual-upload-container">
      <!-- Main Playlist Cloud Upload (PIN Protected) -->
      <label for="main-audio-input" class="upload-action-card global" id="btn-upload-main">
        <i class="ri-cloud-upload-fill"></i>
        <div class="upload-text">
          <strong>Upload to Main Playlist</strong>
          <small>Syncs for everyone • Requires PIN</small>
        </div>
      </label>
      <input type="file" id="main-audio-input" accept="audio/*" hidden>

      <!-- Local Upload (For Personal Session) -->
      <label for="drawer-audio-file-input" class="upload-action-card local">
        <i class="ri-hard-drive-2-fill"></i>
        <div class="upload-text">
          <strong>Upload Local Song</strong>
          <small>Only visible on this device</small>
        </div>
      </label>
      <input type="file" id="drawer-audio-file-input" accept="audio/*" multiple hidden>
    </div>

    <!-- 7. Scrollable Songs List -->
    <div class="playlist-scroll-list" id="playlist-scroll-list"></div>
  </aside>

  <!-- Upload Loading Overlay -->
  <div class="upload-progress-modal" id="upload-modal">
    <div class="modal-content">
      <div class="spinner"></div>
      <p id="upload-status-text">Uploading to Main Playlist...</p>
    </div>
  </div>

  <!-- Native Audio -->
  <audio id="main-audio" preload="auto"></audio>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker registered:', reg.scope))
          .catch(err => console.warn('PWA registration failed:', err));
      });
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
