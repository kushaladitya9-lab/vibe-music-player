<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Music Player - Aesthetic Indian Lo-Fi & Retro Player</title>
  <meta name="description" content="Aesthetic Indian Tapri & Lo-Fi retro music player with dynamic moods, rain sound synthesizer, zen mode, custom wallpapers, and cloud synced tracks." />

  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Dynamic Background Canvas & Layer -->
  <div class="background-overlay" id="bg-overlay"></div>
  <canvas id="visualizer-canvas"></canvas>

  <div class="player-container glass-card">
    <!-- Top Bar Controls -->
    <header class="top-nav">
      <div class="brand">
        <i class="ri-radio-2-fill brand-icon"></i>
        <span>Vibe Player</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="mood-toggle-btn" title="Change Mood"><i class="ri-sun-cloudy-line"></i></button>
        <button class="icon-btn" id="rain-synth-btn" title="Rain Synthesizer"><i class="ri-heavy-showers-line"></i></button>
        <button class="icon-btn" id="zen-mode-btn" title="Zen Mode"><i class="ri-leaf-line"></i></button>
        <button class="icon-btn" id="game-btn" title="Pong Mode"><i class="ri-gamepad-line"></i></button>
        <button class="icon-btn" id="playlist-btn" title="Playlist Drawer"><i class="ri-play-list-2-line"></i></button>
      </div>
    </header>

    <!-- Vinyl / Artwork Display -->
    <main class="artwork-section">
      <div class="vinyl-wrapper" id="vinyl-wrapper">
        <div class="vinyl-disc" id="vinyl-disc">
          <div class="vinyl-grooves"></div>
          <div class="vinyl-label" id="vinyl-label">
            <img src="https://images.unsplash.com/photo-1518609878373-06d740f60d8b?auto=format&fit=crop&w=600&q=80" alt="Album Cover" id="track-art" />
          </div>
        </div>
      </div>
    </main>

    <!-- Track Details & Title Actions -->
    <section class="track-info">
      <div class="title-action-row">
        <h1 class="track-title" id="track-title">Chala Jata Hoon</h1>
        <div class="action-btn-group">
          <!-- Like Button -->
          <button class="title-btn" id="heart-btn" title="Like song">
            <i class="ri-heart-line" id="heart-icon"></i>
          </button>
          <!-- Share Button -->
          <button class="title-btn" id="share-btn" title="Share link">
            <i class="ri-share-forward-line" id="share-icon"></i>
          </button>
        </div>
      </div>
      <p class="track-artist" id="track-artist">Kishore Kumar • Lo-Fi Flip</p>
    </section>

    <!-- Progress / Seek Bar Area -->
    <section class="progress-section">
      <div class="progress-bar-container" id="progress-container">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="time-display">
        <span id="current-time">0:00</span>
        <span id="duration">3:24</span>
      </div>
    </section>

    <!-- Playback Controls -->
    <section class="controls-section">
      <button class="control-btn subtle" id="shuffle-btn" title="Shuffle"><i class="ri-shuffle-line"></i></button>
      <button class="control-btn" id="prev-btn" title="Previous"><i class="ri-skip-back-fill"></i></button>
      <button class="control-btn master-play" id="play-btn" title="Play / Pause"><i class="ri-play-fill" id="play-icon"></i></button>
      <button class="control-btn" id="next-btn" title="Next"><i class="ri-skip-forward-fill"></i></button>
      <button class="control-btn subtle" id="loop-btn" title="Repeat"><i class="ri-repeat-2-line"></i></button>
    </section>

    <!-- Sound / Volume Bar (Platform) -->
    <footer class="bottom-bar">
      <i class="ri-volume-down-line vol-icon"></i>
      <div class="volume-slider-container" id="volume-container">
        <div class="volume-fill" id="volume-fill"></div>
      </div>
      <i class="ri-volume-up-line vol-icon"></i>
    </footer>
  </div>

  <!-- Audio Elements -->
  <audio id="main-audio" src=""></audio>
  <audio id="rain-audio" loop src="https://assets.mixkit.co/active_storage/sfx/2520/2520-preview.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
